id: no-runtime-remote-ui-css
language: Css
severity: error
message: production app styles must not import remote stylesheets
note: Bundle reviewed styles into the app build instead of fetching runtime presentation.
files:
  - packages/**/*.css
ignores:
  - packages/**/generated/**
rule:
  pattern: '@import $SOURCE'
constraints:
  SOURCE:
    regex: '(?:https?:)?//|(?:^|\()\s*["'']?/'
