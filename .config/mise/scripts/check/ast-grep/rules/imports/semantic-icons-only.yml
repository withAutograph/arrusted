id: semantic-icons-only-ts
language: TypeScript
severity: error
message: import icons through the semantic design-system barrel
note: Only the semantic icon barrel may bind directly to @heroicons/react.
files:
  [
    packages/**/*.ts,
    packages/**/*.mts,
    packages/**/*.cts,
  ]
ignores: [packages/design-systems/core/icons/index.ts]
rule:
  any:
    - { all: [{ kind: import_statement }, { has: { field: source, matches: forbidden-source } }] }
    - { all: [{ kind: import_statement }, { regex: '^import\b[\s\S]*?=\s*require\s*\(' }, { has: { matches: forbidden-source, stopBy: end } }] }
    - { all: [{ kind: export_statement }, { has: { field: source, matches: forbidden-source } }] }
    - { pattern: require($SOURCE) }
    - { pattern: import($SOURCE) }
constraints:
  SOURCE: { matches: forbidden-source }
utils:
  forbidden-source:
    all:
      - { any: [{ kind: string }, { kind: template_string }] }
      - { regex: '^[''"\x60]@heroicons/react(?:/[^''"\x60]+)?[''"\x60]$' }
