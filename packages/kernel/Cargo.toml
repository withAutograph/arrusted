[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
postgres_rustls = "0.1"
postgres-types = "0.2"
rust_decimal = { version = "1", default-features = false, features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
uuid.workspace = true
webpki-roots = "1"

[features]
testing = []

[[test]]
name = "contracts"
path = "tests/contracts.rs"
required-features = ["testing"]

[[test]]
name = "materialization"
path = "tests/materialization.rs"
required-features = ["testing"]

[[test]]
name = "sql_transport"
path = "tests/sql_transport.rs"
required-features = ["testing"]
